name: devcenter-admin
on:
  workflow_dispatch:
    inputs:
      op:
        description: 'list | probe | delete'
        required: true
        default: 'probe'
      package:
        description: '包名或 app id（逗号分隔）'
        required: false
        default: ''
      dry_run:
        description: 'true=只演算不删除'
        required: false
        default: 'true'
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: admin
        env:
          TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
          OP: ${{ inputs.op }}
          PKG: ${{ inputs.package }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          API=https://appstore.api.lazycat.cloud/api/v3/developer
          H1="X-User-Token: $TOKEN"; H2="Cookie: userToken=$TOKEN"
          cur() { curl -sS -H "$H1" -H "$H2" "$1"; }
          cur "$API/app/list?size=200" > /tmp/apps.json
          echo "list bytes=$(wc -c < /tmp/apps.json) total=$(jq -r '.total // .count // "?"' /tmp/apps.json 2>/dev/null) items=$(jq -r '(.items//.list//.)|length' /tmp/apps.json 2>/dev/null)"
          IFS=',' read -ra WANT <<< "$PKG"
          case "$OP" in
            raw)
              for w in "${WANT[@]}"; do
                w=$(echo "$w" | xargs); [ -z "$w" ] && continue
                echo "=== $w"; cur "$API/$w" | head -c 3000; echo
              done
              ;;
            list)
              jq -r '(.items // .list // .) | .[] | "\(.id)\t\(.package)\treview=\(.review.status // "-")\t\(.status // "-")"' /tmp/apps.json | sort -t$'\t' -k2
              ;;
            probe)
              for w in "${WANT[@]}"; do
                w=$(echo "$w" | xargs); [ -z "$w" ] && continue
                printf '%-42s exist=%s\n' "$w" "$(cur "$API/check/exist?package=$w" | head -c 200)"
              done
              ;;
            delete)
              for w in "${WANT[@]}"; do
                w=$(echo "$w" | xargs); [ -z "$w" ] && continue
                ids=$(jq -r --arg w "$w" '(.items // .list // .) | .[] | select(.package==$w or (.id|tostring)==$w) | .id' /tmp/apps.json)
                echo "### $w -> ids: $(echo $ids | tr '\n' ' ')"
                for id in $ids; do
                  if [ "$DRY" = "true" ]; then echo "DRY-RUN would delete $id"
                  else
                    code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE -H "$H1" -H "$H2" "$API/app/$id/remove")
                    echo "DELETE $id -> $code"; head -c 300 /tmp/del.json; echo
                  fi
                done
              done
              ;;
          esac
