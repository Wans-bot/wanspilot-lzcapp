name: devcenter-admin
on:
  workflow_dispatch:
    inputs:
      op:
        description: 'list | delete'
        required: true
        default: 'list'
      package:
        description: '包名或 app id（逗号分隔，delete 用）'
        required: false
        default: ''
      dry_run:
        description: 'true=只演算不删除'
        required: false
        default: 'true'
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: admin
        env:
          TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
          OP: ${{ inputs.op }}
          PKG: ${{ inputs.package }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          API=https://appstore.api.lazycat.cloud/api/v3/developer
          list() { curl -sS -H "Authorization: Bearer $TOKEN" "$API/app/list?size=200"; }
          if [ "$OP" = "list" ]; then
            list > /tmp/apps.json
            echo "--- total:"; jq '(.data.total // .total // "?")' /tmp/apps.json
            jq -c '(.data.list // .data // .)[]? | {id, package, status}' /tmp/apps.json | head -400
            exit 0
          fi
          list > /tmp/apps.json
          IFS=',' read -ra WANT <<< "$PKG"
          for w in "${WANT[@]}"; do
            w=$(echo "$w" | xargs); [ -z "$w" ] && continue
            ids=$(jq -r --arg w "$w" '(.data.list // .data // .)[]? | select(.package==$w or (.id|tostring)==$w) | .id' /tmp/apps.json)
            echo "### $w -> matched ids: $(echo $ids | tr '\n' ' ')"
            for id in $ids; do
              if [ "$DRY" = "true" ]; then
                echo "DRY-RUN skip delete $id"
              else
                code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "$API/app/$id/remove")
                echo "DELETE $id -> $code"; cat /tmp/del.json; echo
              fi
            done
          done
