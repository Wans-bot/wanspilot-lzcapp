version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/slskd.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: slskd
    source: ghcr.io/slskd/slskd
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    create_if_missing: true
    application:
      language: zh
      brief: "BT 下载协作面板"
      description: "WansPilot 管理 BT 下载任务：磁力与种子导入、进度与速度监控、任务分享，可直接从网盘中打开 .torrent 文件。"
      keywords: "下载, BT, 种子, 磁力, 任务管理"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
