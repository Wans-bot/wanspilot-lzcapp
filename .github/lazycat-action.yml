version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/wanspilot.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git   # 源码构建、无上游镜像 tag：版本由本仓库 tag 决定

build:
  run_buildscript: false

images: []

stores:
  official:
    changelog_locales:
      - zh
      - en
    enabled: true
    create_if_missing: true
    continue_if_newer_version: true
    skip_if_version_exists: false
    retry:
      enabled: true
      max_attempts: 4
      initial_delay: 5s
      max_delay: 60s
      max_upload_timeout: 600s
    application:
      language: zh
      brief: "BT 下载协作面板"
      description: "WansPilot 管理 BT 下载任务：磁力与种子导入、进度与速度监控、任务分享，可直接从网盘中打开 .torrent 文件。"
      keywords: "下载, BT, 种子, 磁力, 任务管理"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
